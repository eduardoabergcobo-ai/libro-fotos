<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor - Libro de Fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editor.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-grupo">
      <span class="marca-icono">📖</span>
      <button id="btnProyectos" class="boton-proyecto">
        <span id="nombreProyectoActivo">Mi libro de fotos</span>
        <span class="caret">▾</span>
      </button>
    </div>

    <div class="topbar-grupo topbar-centro">
      <button id="btnDeshacer" class="icono-topbar" title="Deshacer (Ctrl+Z)" disabled>↶</button>
      <button id="btnRehacer" class="icono-topbar" title="Rehacer (Ctrl+Y)" disabled>↷</button>
      <span id="indicadorGuardado" class="indicador-guardado"></span>
    </div>

    <div class="topbar-grupo">
      <button id="btnDensidad" class="icono-topbar" title="Tamaño de la barra de herramientas">🔎</button>
      <button id="btnVistaPrevia" class="boton boton-fantasma">👁 Vista previa</button>
      <button id="btnDescargar" class="boton boton-primario">⬇ Descargar</button>
    </div>
  </header>

  <div class="cuerpo">
    <nav class="rail">
      <button class="rail-boton" id="railFoto" title="Agregar fotos">
        <span class="rail-icono">📷</span><span class="rail-etiqueta">Fotos</span>
      </button>
      <button class="rail-boton" id="railTexto" title="Agregar texto">
        <span class="rail-icono">🔤</span><span class="rail-etiqueta">Texto</span>
      </button>
      <button class="rail-boton" data-panel="disenos" title="Diseños con varias fotos">
        <span class="rail-icono">▦</span><span class="rail-etiqueta">Diseños</span>
      </button>
      <button class="rail-boton" data-panel="fondo" title="Color o foto de fondo">
        <span class="rail-icono">🎨</span><span class="rail-etiqueta">Fondo</span>
      </button>
      <button class="rail-boton" data-panel="ubicacion" title="Mapa y bandera de un lugar">
        <span class="rail-icono">📍</span><span class="rail-etiqueta">Ubicación</span>
      </button>
      <button class="rail-boton" data-panel="paginas" title="Tapa, contratapa y páginas">
        <span class="rail-icono">📑</span><span class="rail-etiqueta">Páginas</span>
      </button>
    </nav>

    <aside id="panelLateral" class="panel-lateral oculto">
      <div class="panel-lateral-cabecera">
        <h3 id="panelLateralTitulo"></h3>
        <button id="btnCerrarPanel" class="cerrar-panel">✕</button>
      </div>
      <div id="panelLateralContenido" class="panel-lateral-contenido"></div>
    </aside>

    <main class="zona-canvas">
      <div class="barra-paginas">
        <button id="btnPaginaPrev" class="icono-canvas">◀</button>
        <span id="indicadorPagina" class="indicador-pagina"></span>
        <button id="btnPaginaNext" class="icono-canvas">▶</button>
        <span class="separador-vertical"></span>
        <button id="btnPaginaNueva" class="boton boton-chico">＋ Página</button>
        <button id="btnPaginaBorrar" class="boton boton-chico boton-peligro">🗑 Borrar</button>
      </div>

      <div id="barraFormato" class="barra-formato oculto">
        <select id="selectFuente" class="select-fuente"></select>
        <span class="separador-vertical"></span>
        <button id="btnTamanoMenos" class="icono-canvas">－</button>
        <span id="indicadorTamano" class="indicador-zoom">5</span>
        <button id="btnTamanoMas" class="icono-canvas">＋</button>
        <span class="separador-vertical"></span>
        <button id="btnAlinearIzq" class="icono-canvas" title="Alinear a la izquierda">Izq</button>
        <button id="btnAlinearCentro" class="icono-canvas" title="Centrar">Centro</button>
        <button id="btnAlinearDer" class="icono-canvas" title="Alinear a la derecha">Der</button>
      </div>

      <div class="envoltorio-hoja">
        <div class="hoja-contenedor" id="hojaContenedor">
          <div class="hoja" id="hoja"></div>
        </div>
      </div>

      <div class="controles-zoom">
        <button id="btnZoomMenos" class="icono-canvas">－</button>
        <span id="indicadorZoom" class="indicador-zoom">100%</span>
        <button id="btnZoomMas" class="icono-canvas">＋</button>
        <button id="btnZoomReset" class="icono-canvas" title="Restablecer zoom">⤾</button>
      </div>
    </main>
  </div>

  <p class="ayuda">
    Arrastrá cada elemento desde <strong>⠿</strong>, cambiá su tamaño desde <strong>⤡</strong>, duplicalo con <strong>⧉</strong> y borralo con <strong>×</strong>.
    Todo se guarda solo en este navegador — cuando termines, tocá <strong>"Descargar"</strong> y subilo a tu sitio.
  </p>

  <div id="overlayPreview" class="overlay-preview oculto">
    <div class="barra-preview">
      <span>👁 Vista previa de tu libro</span>
      <button id="btnCerrarPreview" class="boton boton-fantasma-oscuro">✕ Cerrar</button>
    </div>
    <iframe id="iframePreview" class="iframe-preview" title="Vista previa del libro"></iframe>
  </div>

  <div id="modalOverlay" class="modal-overlay oculto">
    <div class="modal-tarjeta">
      <h3 id="modalTitulo"></h3>
      <p id="modalMensaje"></p>
      <input id="modalInput" class="modal-input oculto" type="text" spellcheck="false">
      <div id="modalCasillas" class="modal-casillas"></div>
      <div class="modal-botones">
        <button id="modalCancelar" class="boton"></button>
        <button id="modalOk" class="boton boton-primario"></button>
      </div>
    </div>
  </div>

  <input type="file" id="inputFoto" accept="image/*" multiple hidden>
  <input type="file" id="inputAuxiliar" accept="image/*" hidden>

</div>

<script src="editor.js"></script>
</body>
</html>
